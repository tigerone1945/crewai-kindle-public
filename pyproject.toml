[project]
name = "crewai-kindle"
version = "0.1.0"
description = "CrewAIで育てるAIエージェント - 売上データ分析からCrew・Flow・Productionまで"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai==1.15.23",
    "fastapi>=0.142.2",
    "pandas>=2.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
